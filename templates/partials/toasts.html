{% if messages %}
<div class="mb-6 space-y-2">
    {% for message in messages %}
        <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)" x-transition
             class="card flex items-start gap-3 border-l-4 px-4 py-3 text-sm {% if message.tags == 'error' %}border-l-destructive{% else %}border-l-primary{% endif %}">
            <span class="flex-1">{{ message }}</span>
            <button type="button" @click="show = false" class="text-muted-foreground hover:text-foreground" aria-label="✕">✕</button>
        </div>
    {% endfor %}
</div>
{% endif %}
