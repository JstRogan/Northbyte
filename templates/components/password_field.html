{% comment %}Password field with show/hide toggle. Expects: field{% endcomment %}
<div class="space-y-1.5" x-data="{ show: false }">
    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}</label>
    <div class="relative">
        {{ field }}
        <button type="button" tabindex="-1"
                @click="show = !show; document.getElementById('{{ field.id_for_label }}').type = show ? 'text' : 'password'"
                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
            <svg x-show="!show" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg x-show="show" x-cloak class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.9 5.1A9.8 9.8 0 0112 5c6.5 0 10 7 10 7a13.2 13.2 0 01-3 3.6M6.1 6.1A13.3 13.3 0 002 12s3.5 7 10 7a9.7 9.7 0 003-.5"/></svg>
        </button>
    </div>
    {% if field.errors %}<p class="field-error">{{ field.errors|striptags }}</p>{% endif %}
</div>
